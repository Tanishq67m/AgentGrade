# Publishes to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Uses PyPI Trusted Publishing: no API token is stored anywhere. One-time setup on pypi.org:
# add a "pending publisher" for project agentgrade-mcp, owner Tanishq67m, repository AgentGrade,
# workflow release.yml, environment pypi.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Tag matches the package version
        run: |
          version=$(uv run python -c "import agentgrade; print(agentgrade.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
