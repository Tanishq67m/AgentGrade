[project]
# PyPI distribution name: "agentgrade" belongs to an unrelated project. The import package and the
# command are still `agentgrade`.
name = "agentgrade-mcp"
dynamic = ["version"]  # from src/agentgrade/__init__.py
description = "Measure whether AI agents can actually use an MCP server: repeated runs, checked answers, traces, and A/B tests of tool descriptions and server builds."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanishq Mohod" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "evaluation", "llm", "testing", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=2.3,<3",  # v2 API (Client, MCPServer); v1 is incompatible
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
agentgrade = "agentgrade.cli:main"

[project.urls]
Homepage = "https://github.com/Tanishq67m/AgentGrade"
Repository = "https://github.com/Tanishq67m/AgentGrade"
Issues = "https://github.com/Tanishq67m/AgentGrade/issues"
"Case study" = "https://github.com/Tanishq67m/AgentGrade/blob/main/docs/CASE_STUDY.md"
Changelog = "https://github.com/Tanishq67m/AgentGrade/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentgrade/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgrade"]

# `agentgrade init` copies these into a folder of the user's choice. They keep the repo's layout
# (suites/ next to fixtures/), so the suites' relative paths still work.
[tool.hatch.build.targets.wheel.force-include]
"suites/shop.yaml" = "agentgrade/examples/suites/shop.yaml"
"suites/git.yaml" = "agentgrade/examples/suites/git.yaml"
"suites/memory.yaml" = "agentgrade/examples/suites/memory.yaml"
"suites/sqlite.yaml" = "agentgrade/examples/suites/sqlite.yaml"
"suites/time.yaml" = "agentgrade/examples/suites/time.yaml"
"fixtures/shop" = "agentgrade/examples/fixtures/shop"
"fixtures/git_repo" = "agentgrade/examples/fixtures/git_repo"
"fixtures/shop_sqlite" = "agentgrade/examples/fixtures/shop_sqlite"
"fixtures/team_memory" = "agentgrade/examples/fixtures/team_memory"
"model_configs" = "agentgrade/examples/model_configs"

[tool.hatch.build.targets.sdist]
exclude = [".targets", "runs", ".venv", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# async test functions run automatically on an event loop (no decorator needed)
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, B = common bug patterns, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# markdown table templates read better unwrapped
"src/agentgrade/report.py" = ["E501"]
"src/agentgrade/static_score.py" = ["E501"]
# parametrize tables of invalid suite fragments
"tests/test_suite.py" = ["E501"]
# fixture data tables read better unwrapped
"fixtures/**/*.py" = ["E501"]
